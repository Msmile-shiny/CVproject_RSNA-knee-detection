# =============================================================================
# RSNA 2026 Knee — Multi-Model Ensemble (Phase 4)
# =============================================================================
# 策略:
#   1. 独立训练 N 个不同 backbone
#   2. 推理时加权平均各模型 sigmoid 概率
#   3. 最终 submission 可选与 TriPlane + 3D 结果合并
#
# Backbone 阵容:
#   - EfficientNetV2-S  (Phase 1, 特征维度 1280)
#   - ConvNeXt-S        (特征维度 768)
#   - Swin-T            (特征维度 768)
#   - TriPlaneModel     (Phase 2, 三平面融合, 输出 12 logits)
#   - ResNet3D-18       (Phase 3, 3D volume)
#
# 训练: 各 backbone 独立训练 (本 config 控制单个 backbone)
# 推理: 使用 EnsembleInference 加载所有 checkpoint 加权平均
# =============================================================================

experiment:
  name: ensemble_backbone
  seed: 2026
  stage: phase4
  description: "Phase 4 Ensemble — multi-backbone training + weighted average inference"

# ---------------------------------------------------------------------------
# 路径
# ---------------------------------------------------------------------------
paths:
  data_root: dataset
  dicom_root: dataset/train_series
  test_dicom_root: dataset/test_series
  train_csv: data/metadata/train.csv
  series_csv: data/metadata/train_series.csv
  test_series_csv: data/metadata/test_series.csv
  pseudo_csv: data/pseudo_labels.csv
  output_dir: outputs/ensemble
  checkpoint_dir: outputs/ensemble/checkpoints

# ---------------------------------------------------------------------------
# 数据
# ---------------------------------------------------------------------------
data:
  image_size: 384
  slice_count: 5
  planes: [Sagittal]                              # 单平面训练 (每个 backbone 独立)
  fluid_sensitive_only: false
  fat_suppression_only: false
  loader:
    train_workers: 4
    valid_workers: 2
    pin_memory: true

# ---------------------------------------------------------------------------
# 模型 — 指定要训练的 backbone
# ---------------------------------------------------------------------------
model:
  # 选择: "efficientnetv2_s" | "convnext_small" | "swin_tiny"
  arch: convnext_small

  # 通用参数
  in_channels: 5
  num_classes: 12
  pretrained: true
  dropout: 0.3

  # EfficientNetV2-S 特有
  feature_dim: 1280

  # ConvNeXt/Swin 共享 (EfficientNet 忽略)
  # feature_dim 会自动从 backbone 读取

# ---------------------------------------------------------------------------
# 训练
# ---------------------------------------------------------------------------
train:
  device: cuda
  epochs: 50
  batch_size: 8
  gradient_accumulation_steps: 2                  # effective = 16
  mixed_precision: true
  gradient_clip_norm: 1.0
  early_stopping:
    enabled: true
    monitor: val_macro_auc
    mode: max
    patience: 10
    min_delta: 0.001

# ---------------------------------------------------------------------------
# 优化器
# ---------------------------------------------------------------------------
optimizer:
  name: adamw
  lr: 2.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

# ---------------------------------------------------------------------------
# 调度器
# ---------------------------------------------------------------------------
scheduler:
  name: cosine_warm_restart
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-6

# ---------------------------------------------------------------------------
# 损失
# ---------------------------------------------------------------------------
loss:
  name: focal_bce
  gamma: 2.0
  alpha: 0.25

# ---------------------------------------------------------------------------
# 伪标签
# ---------------------------------------------------------------------------
pseudo_label:
  enabled: true
  pseudo_csv: data/pseudo_labels.csv
  gold_csv: data/metadata/train.csv
  confidence: HIGH

# ---------------------------------------------------------------------------
# 验证
# ---------------------------------------------------------------------------
validation:
  strategy: fixed_split
  metric: macro_roc_auc

# ---------------------------------------------------------------------------
# 推理
# ---------------------------------------------------------------------------
inference:
  aggregation: topk_mean
  topk_fraction: 0.25
  tta: false
  batch_size: 16

# ---------------------------------------------------------------------------
# 集成配置 (最终提交用 — 此 section 仅供文档/脚本参考)
# ---------------------------------------------------------------------------
ensemble:
  # 模型阵容
  models:
    - name: efficientnetv2_s
      checkpoint: outputs/efficientnetv2_s/checkpoints/best_model.pt
      weight: 0.25
    - name: convnext_small
      checkpoint: outputs/ensemble/checkpoints/convnext_small_best.pt
      weight: 0.20
    - name: swin_tiny
      checkpoint: outputs/ensemble/checkpoints/swin_tiny_best.pt
      weight: 0.15
    - name: triplane_efficientnetv2s
      checkpoint: outputs/triplane_efficientnetv2s/checkpoints/best_model.pt
      weight: 0.25
    - name: resnet3d_18
      checkpoint: outputs/resnet3d_18/checkpoints/best_model.pt
      weight: 0.15

  # 后处理: 合并多个 submission CSV
  submission_merge:
    enabled: true
    # 直接用每个 backbone 的 submission CSV 做加权平均
