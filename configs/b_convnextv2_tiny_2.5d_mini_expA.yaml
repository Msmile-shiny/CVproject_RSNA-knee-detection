# =============================================================================
# RSNA 2026 膝关节异常检测 — 主力配置文件
# =============================================================================
# 方案: 2.5D triplet（3 张相邻 Sagittal 切片堆叠为 3 通道）
# 模型: ConvNeXtV2-Tiny（28M 参数, ImageNet-22k 预训练）
# 数据: mini 集 ~600 exam, 每 exam ~16 张 Sagittal 切片
#
# 为什么选这个方案:
#   - 3 通道输入 = 原生 ImageNet 预训练, 不需要改第一层权重
#   - 相邻 3 切片让模型学到切片间的空间连续性 → 后续迁移到 3D 有基础
#   - ConvNeXtV2-Tiny 在现代 CNN 中医学迁移效果最好, 显存占用低
#   - 8GB 显存跑 batch=16 无压力
#
# 和纯 2D (in_channels=1) 的区别:
#   - 2D:    每张切片独立预测, 1 通道, 需要改预训练第一层权重
#   - 2.5D:  每次看 3 张连续切片, 3 通道, 直接用预训练, 空间信息更丰富
# =============================================================================

experiment:
  name: convnextv2_tiny_2p5d_mini_expA  # 实验名称, 用于日志和 checkpoint 命名
  seed: 2026                             # 全局随机种子, 保证可复现
  stage: 2.5d_expA_anti_overfit          # 阶段标识: 实验 A — 反过拟合
  description: "ExpA: ASL γ_neg=2, dropout=0.5, drop_path=0.2, warmup=1 — 减缓过拟合"

# ---------------------------------------------------------------------------
# 路径配置 — 所有输入输出目录
# ---------------------------------------------------------------------------
paths:
  data_root: data                                     # 数据根目录
  npy_root: data/mini/npy                             # 预处理好的 npy 切片
  metadata_csv: data/processed/mini_set_metadata.csv   # 切片索引 (StudyInstanceUID, SeriesInstanceUID, SOPInstanceUID)
  train_csv: data/metadata/train.csv                   # 标签文件 (StudyInstanceUID + 12 个 label)
  cache_dir: data/cache/convnextv2_tiny_2p5d           # 缓存目录 (暂未使用)
  output_dir: outputs/convnextv2_tiny_2p5d_mini_expA        # 输出根目录
  checkpoint_dir: outputs/convnextv2_tiny_2p5d_mini_expA/checkpoints  # 模型权重保存位置
  oof_dir: outputs/convnextv2_tiny_2p5d_mini_expA/oof       # Out-of-Fold 预测保存位置

# ---------------------------------------------------------------------------
# 数据配置 — 输入格式、预处理、加载方式
# ---------------------------------------------------------------------------
data:
  image_format: npy                                          # 切片存储格式
  hierarchy: StudyInstanceUID/SeriesInstanceUID/SOPInstanceUID.npy  # 文件层级, 对应 npy_root 下的目录结构
  image_size: 224                                            # 输入尺寸, ConvNeXtV2 标准是 224×224
  in_channels: 3                                             # ★ 输入通道: 3 = 三切片堆叠, 1 = 单切片灰度
  slice_offset: 1                                            # ★ 切片间距: 1 表示取 [z-1, z, z+1] 三张相邻切片
  target_count: 12                                           # 分类目标数 (12 个异常类别)
  target_columns:                                            # 12 个标签名称, 按竞赛定义
    - ACL               # 前交叉韧带
    - MCL               # 内侧副韧带
    - Medial Meniscus   # 内侧半月板
    - Lateral Meniscus  # 外侧半月板
    - Medial OA         # 内侧骨关节炎
    - Lateral OA        # 外侧骨关节炎
    - PF OA             # 髌股骨关节炎
    - Effusion          # 关节积液
    - Synovitis         # 滑膜炎
    - Baker's           # 腘窝囊肿
    - Contusion         # 骨挫伤
    - Fracture          # 骨折

  normalization:                # 归一化参数 (预处理阶段已做, 此处保留供参考)
    method: percentile_zscore   # 百分位 z-score: 裁剪 0.5%/99.5% 极值后标准化
    lower_percentile: 0.5
    upper_percentile: 99.5
    epsilon: 1.0e-6             # 防除零

  loader:                       # DataLoader 参数
    train_workers: 4            # 训练时数据加载线程数
    valid_workers: 2            # 验证时数据加载线程数
    pin_memory: true            # 锁页内存, 加速 CPU→GPU 传输
    persistent_workers: true    # 复用 worker 进程, 避免每 epoch 重新 fork
    prefetch_factor: 2          # 每个 worker 预取 batch 数

# ---------------------------------------------------------------------------
# 验证配置 — 如何划分训练/验证集, 如何评估
# ---------------------------------------------------------------------------
validation:
  strategy: stratified_group_kfold  # 分层组 K 折交叉验证
  folds: 5                          # K=5, 标准做法
  group_column: StudyInstanceUID    # ★ 分组列: 同一个 Study 的所有切片/triplet 必须在同一 fold
                                    #   这是铁律, 防止同一患者的数据泄漏到训练集
  shuffle: true
  random_state: 2026
  metric: macro_roc_auc             # 竞赛评估指标: 12 类 AUC 的算术平均
  save_oof_logits: true             # 保存每 fold 的验证集预测 logits
  report_per_target_auc: true       # 报告每一类的 AUC (方便定位哪类效果差)
  leakage_checks:                   # 数据泄漏检查
    patient_overlap: error          # 如果同一 patient 出现在 train 和 valid, 报错
    study_overlap: error            # 如果同一 study 出现在 train 和 valid, 报错

# ---------------------------------------------------------------------------
# 模型配置 — backbone + 分类头
# ---------------------------------------------------------------------------
model:
  arch: convnextv2_tiny             # ★ backbone 架构, 可选: convnextv2_small, tf_efficientnet_b0, resnet50
  library: timm                     # 模型来源: timm (PyTorch Image Models)
  pretrained: true                  # 是否加载预训练权重
  pretrained_source: imagenet22k    # 预训练数据: ImageNet-22k (1400 万张, 比 1k 多 20 倍类别)
                                    #   imagenet22k → 特征更通用 → 跨域迁移到 MRI 更好
  in_channels: 3                    # ★ 输入通道: 3 切片 → 和 ImageNet 预训练的 RGB 三通道完全匹配
                                    #   如果是 2D 单切片, 设 1, 但需要改第一层 conv 权重
  num_classes: 12                   # 输出类别数
  global_pool: avg                  # 全局池化方式
  dropout: 0.5                      # ★ ExpA: 0.3→0.5, 强力防止分类头记忆
  drop_path_rate: 0.2               # ★ ExpA: 0.1→0.2, 20% 的层随机丢弃

# ---------------------------------------------------------------------------
# 训练配置 — 超参数、优化策略、早停
# ---------------------------------------------------------------------------
train:
  device: cuda                      # 训练设备
  epochs: 30                        # 最大训练轮数 (早停通常会在 15-20 轮停止)
  batch_size: 32                    # ★ 每步样本数, 当前只用 ~3GB/8GB, 翻倍利用显存
                                    #   如果想试试更大 batch, 可以调成 32
  gradient_accumulation_steps: 1    # 梯度累积步数, 1 = 不累积
                                    #   effective_batch = batch_size × accumulation_steps = 16
  mixed_precision: true             # 混合精度训练 (fp16), 省显存 + 加速
  precision: fp16                   # 精度类型
  channels_last: true               # NHWC 内存布局, RTX 50 系列支持, 加速 ~10%
  gradient_clip_norm: 1.0           # 梯度裁剪, 防止梯度爆炸
  early_stopping:                   # 早停策略
    enabled: true
    monitor: val_macro_auc          # 监控验证集 macro AUC
    mode: max                       # 越大越好
    patience: 8                     # 连续 8 轮不提升就停
    min_delta: 0.0005               # 提升阈值, 小于此值不算提升

# ---------------------------------------------------------------------------
# 优化器配置
# ---------------------------------------------------------------------------
optimizer:
  name: adamw                       # AdamW = Adam + 解耦权重衰减
  backbone_lr: 2.0e-5               # ★ backbone 学习率: 2e-5, 预训练模型用小学习率
  head_lr: 1.0e-4                   # ★ 分类头学习率: 1e-4, 新初始化的层用大学习率
                                    #   这是迁移学习的标准做法: backbone 慢, head 快
  weight_decay: 0.05                # 权重衰减 (L2 正则), 0.05 适中
  betas: [0.9, 0.999]               # Adam 动量参数

# ---------------------------------------------------------------------------
# 学习率调度器
# ---------------------------------------------------------------------------
scheduler:
  name: cosine                      # 余弦退火: 学习率从初始值平滑降到 min_lr
  warmup_epochs: 1                  # ★ ExpA: 3→1, 预训练特征迁移好, 缩短预热
  min_lr: 1.0e-6                    # 最终的 1/20, 防止学习率降到 0

# ---------------------------------------------------------------------------
# 损失函数
# ---------------------------------------------------------------------------
loss:
  name: asl                         # ★ Asymmetric Loss (ICCV 2021): 专治多标签极度不均衡
                                    #   不需要手动 pos_weight — γ_neg 天然抑制简单负样本
  gamma_neg: 2.0                    # ★ ExpA: 4→2, 减轻负样本压制, 延缓过拟合
  gamma_pos: 1.0                    # 正样本聚焦: 1 = 温和保护稀有正样本
  clip: 0.05                        # 概率裁剪: 防止 log(0) 数值溢出

# ---------------------------------------------------------------------------
# 数据增强 — 仅在训练时生效, 验证时只做 resize
# ---------------------------------------------------------------------------
augmentation:
  train:
    horizontal_flip_probability: 0.5         # ★ 水平翻转概率 50%, 膝关节左右翻转在医学上合法
    rotate_limit_degrees: 10                 # 随机旋转 ±10°
    shift_limit: 0.05                        # 随机平移 5%
    scale_limit: 0.1                         # 随机缩放 10%
    brightness_contrast_probability: 0.3     # 亮度/对比度抖动 30%
    gamma_probability: 0.2                   # Gamma 校正 20% (MRI 信号强度会因扫描参数变化)
    coarse_dropout_probability: 0.15         # 随机遮挡 15% (模拟局部信号丢失/伪影)
  valid:
    resize_only: true                        # 验证集只做 resize, 不做增强

# ---------------------------------------------------------------------------
# 推理配置 — 如何从切片级预测聚合为 study 级预测
# ---------------------------------------------------------------------------
inference:
  aggregation: topk_mean            # ★ 聚合方式: 每个 study 的 triplet 取 top 25% 的分数取平均
                                    #   因为一个 study 有 ~14 个 triplet, 不是所有都能看到异常
                                    #   取最"自信"的那部分取平均, 比全量平均更准
  topk_fraction: 0.25               # 保留前 25% 最高置信度的预测
  fold_ensemble: mean_logits        # ★ Fold 集成方式: 5 个 fold 的 logits 取平均
                                    #   mean logits 比 mean probs 更稳定 (避免 sigmoid 饱和)
  tta:
    enabled: false                  # 测试时增强 (Test Time Augmentation), 先关掉, 速度快
  prediction_range_check: true      # 检查预测值是否在 [0,1], 异常则报警

# ---------------------------------------------------------------------------
# 日志配置
# ---------------------------------------------------------------------------
logging:
  log_every_n_steps: 20             # 每 20 步打印一次日志
  save_best_only: true              # 只保存在验证集上最优的 checkpoint
  save_config_copy: true            # 训练开始时把此配置文件复制到 output_dir
  track_gpu_memory: true            # 记录 GPU 显存使用情况
  wandb:
    enabled: false                  # 暂不使用 WandB, 有需要再开

# ---------------------------------------------------------------------------
# 验收标准 — Mini 阶段成功的定义
# ---------------------------------------------------------------------------
acceptance:
  require_all_targets_in_each_validation_fold: true   # 每个 fold 的验证集必须包含全部 12 类
  require_zero_patient_leakage: true                   # 零患者泄漏 (铁律)
  require_finite_oof_predictions: true                 # OOF 预测不能有 NaN/Inf
  minimum_macro_auc: 0.55                             # ★ macro AUC 最低门槛: 0.55
                                                      #   随机猜测是 0.5, 0.55 说明模型学到了东西
                                                      #   Mini 集 > 0.55 = 管线可信任, 可以推进全量
