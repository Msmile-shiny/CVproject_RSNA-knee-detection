# =============================================================================
# RSNA 2026 膝关节异常检测 — 快速实验备用配置
# =============================================================================
# 方案: 2.5D triplet + EfficientNet-B0
# 模型: EfficientNet-B0（5.3M 参数, ImageNet-1k 预训练）
# 数据: mini 集 ~600 exam (和主力配置相同数据)
#
# 用途: 如果想快速验证一个想法 (改损失函数/改增强/改学习率), 用这个配置
#       5.3M 参数 → 训练极快, 30 epoch 可能 2 小时跑完 5 fold
#
# ★ 和主力配置 (ConvNeXtV2-Tiny) 的区别:
#   B0 (本配置):       5.3M 参数, 上限低但迭代快, 适合快速实验
#   ConvNeXtV2 (主力): 28M 参数, 上限高, 最终提交用
#
# 不推荐用 B0 做最终提交, 它的特征容量只有 ConvNeXtV2 的 1/5
# =============================================================================

experiment:
  name: efficientnet_b0_2p5d_mini
  seed: 2026
  stage: mini_baseline
  description: "2.5D EfficientNet-B0 baseline — fast iteration / pipeline validation"

# ---------------------------------------------------------------------------
# 路径配置
# ---------------------------------------------------------------------------
paths:
  data_root: data
  npy_root: data/mini/npy
  image_index_csv: data/metadata/mini_npy_index.csv
  original_archive: data/raw/archives/mini_set_npy.tar.gz
  metadata_dir: data/metadata
  cache_dir: data/cache/efficientnet_b0_2p5d_256
  output_dir: outputs/efficientnet_b0_2p5d_mini
  checkpoint_dir: outputs/efficientnet_b0_2p5d_mini/checkpoints
  oof_dir: outputs/efficientnet_b0_2p5d_mini/oof

data:
  train_csv: null                    # 使用 metadata 路径 (上方)
  test_csv: null
  sample_submission_csv: null
  patient_id_column: null
  study_id_column: null
  series_id_column: null
  target_columns: null

  image_format: npy
  hierarchy: study_uid/series_uid/sop_uid.npy
  image_size: 256                    # ★ EfficientNet-B0 标准输入是 256, 不是 224
  in_channels: 3                     # 3 切片堆叠
  slices_per_sample: 3               # 每样本 3 张切片
  slice_offsets: [-1, 0, 1]          # [前一帧, 当前帧, 后一帧]
  slice_sort_priority:               # 排序优先级 (当 DICOM tag 可用时)
    - ImagePositionPatient
    - InstanceNumber

  normalization:
    method: percentile_zscore
    lower_percentile: 0.5
    upper_percentile: 99.5
    epsilon: 1.0e-6

  sampling:
    unit: study
    mini_studies: 500
    preserve_patient_groups: true
    preserve_target_distribution: true
    positive_oversampling: false

  loader:
    train_workers: 4
    valid_workers: 2
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2

validation:
  strategy: stratified_group_kfold
  folds: 5
  group_column: patient_id
  shuffle: true
  random_state: 2026
  metric: macro_roc_auc
  save_oof_logits: true
  report_per_target_auc: true
  leakage_checks:
    patient_overlap: error
    study_overlap: error

model:
  arch: tf_efficientnet_b0           # ★ 5.3M 参数, 极轻量
  library: timm
  pretrained: true
  pretrained_source: imagenet        # ImageNet-1k, 不是 22k
  in_channels: 3
  num_classes: auto
  global_pool: avg
  dropout: 0.2                       # 模型小, dropout 可以低一点
  drop_path_rate: 0.1

train:
  device: cuda
  epochs: 15                         # ★ 模型小 + 收敛快, 15 轮足够
  batch_size: 4                      # 显存足够但 B0 太轻量, batch 小一点方便快速迭代
  gradient_accumulation_steps: 4     # 有效 batch = 4×4 = 16
  effective_batch_size: 16
  mixed_precision: true
  precision: fp16
  channels_last: true
  gradient_clip_norm: 1.0
  early_stopping:
    enabled: true
    monitor: val_macro_auc
    mode: max
    patience: 5                      # 小模型收敛快, 5 轮不提升就停
    min_delta: 0.0005

optimizer:
  name: adamw
  backbone_lr: 2.0e-5
  head_lr: 1.0e-4
  weight_decay: 1.0e-4               # 小模型用更小的 weight decay
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 2
  min_lr: 1.0e-6

loss:
  name: bce_with_logits
  label_smoothing: 0.0               # B0 做快速实验, 先不加 smoothing
  pos_weight: null

augmentation:
  train:
    horizontal_flip_probability: 0.0  # 关掉 (快速实验, 先不加)
    rotate_limit_degrees: 8
    shift_limit: 0.05
    scale_limit: 0.08
    brightness_contrast_probability: 0.25
    gamma_probability: 0.20
    coarse_dropout_probability: 0.10
  valid:
    resize_only: true

inference:
  aggregation: topk_mean
  topk_fraction: 0.25
  fold_ensemble: mean_logits
  tta:
    enabled: false
  prediction_range_check: true
  validate_sample_submission: true

logging:
  log_every_n_steps: 20
  save_best_only: true
  save_config_copy: true
  track_gpu_memory: true
  wandb:
    enabled: false
    project: rsna-knee-abnormality-detection

acceptance:
  require_all_targets_in_each_validation_fold: true
  require_zero_patient_leakage: true
  require_finite_oof_predictions: true
  minimum_macro_auc: 0.55
