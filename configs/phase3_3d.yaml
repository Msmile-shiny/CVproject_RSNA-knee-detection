# =============================================================================
# RSNA 2026 Knee — 3D Volumetric Model (Phase 3)
# =============================================================================
# ResNet3D-18: 轻量 3D CNN, 验证 3D 管线在 8GB VRAM 上可跑通
# 为云端全量 3D 训练做准备
# =============================================================================

experiment:
  name: resnet3d_18
  seed: 2026
  stage: phase3
  description: "Lightweight ResNet3D-18, 128×128×32 volume, gradient checkpointing"

# ---------------------------------------------------------------------------
# 路径
# ---------------------------------------------------------------------------
paths:
  data_root: dataset
  dicom_root: dataset/train_series
  test_dicom_root: dataset/test_series
  train_csv: data/metadata/train.csv
  series_csv: data/metadata/train_series.csv
  test_series_csv: data/metadata/test_series.csv
  pseudo_csv: data/pseudo_labels.csv
  output_dir: outputs/resnet3d_18
  checkpoint_dir: outputs/resnet3d_18/checkpoints

# ---------------------------------------------------------------------------
# 数据
# ---------------------------------------------------------------------------
data:
  volume_depth: 32                              # 32 层连续切片
  volume_size: 128                              # 每层 resize 到 128×128
  plane: Sagittal                               # 仅 Sagittal (节省 VRAM)
  loader:
    train_workers: 2                            # 3D I/O 重, worker 不宜多
    valid_workers: 1
    pin_memory: true

# ---------------------------------------------------------------------------
# 模型
# ---------------------------------------------------------------------------
model:
  arch: resnet3d_18
  in_channels: 1                                # 灰度 MRI
  num_classes: 12
  feature_dim: 512                              # ResNet3D-18 输出
  pretrained: true
  dropout: 0.3
  use_grad_checkpoint: true                     # 必须! 省 VRAM 关键

# ---------------------------------------------------------------------------
# 训练
# ---------------------------------------------------------------------------
train:
  device: cuda
  epochs: 40
  batch_size: 1                                 # 3D 显存紧, 只能 bs=1
  gradient_accumulation_steps: 8                # effective batch = 1 × 8 = 8
  mixed_precision: true                         # AMP fp16 必须
  gradient_clip_norm: 1.0
  early_stopping:
    enabled: true
    monitor: val_macro_auc
    mode: max
    patience: 8
    min_delta: 0.001

# ---------------------------------------------------------------------------
# 优化器
# ---------------------------------------------------------------------------
optimizer:
  name: adamw
  lr: 1.0e-4                                    # 3D 模型用更低 LR
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

# ---------------------------------------------------------------------------
# 调度器
# ---------------------------------------------------------------------------
scheduler:
  name: cosine_warm_restart
  T_0: 10
  T_mult: 2
  eta_min: 1.0e-6

# ---------------------------------------------------------------------------
# 损失
# ---------------------------------------------------------------------------
loss:
  name: focal_bce
  gamma: 2.0
  alpha: 0.25

# ---------------------------------------------------------------------------
# 伪标签
# ---------------------------------------------------------------------------
pseudo_label:
  enabled: true
  pseudo_csv: data/pseudo_labels.csv
  gold_csv: data/metadata/train.csv
  confidence: HIGH

# ---------------------------------------------------------------------------
# 验证
# ---------------------------------------------------------------------------
validation:
  strategy: fixed_split                           # train=pseudo, val=gold
  metric: macro_roc_auc

# ---------------------------------------------------------------------------
# 推理
# ---------------------------------------------------------------------------
inference:
  aggregation: mean                               # 3D 每 study 就 1 个 volume, 直接 mean
  topk_fraction: 1.0                              # (等同于取所有切片)
  tta: false
  batch_size: 1                                   # 3D 推理也只能 bs=1
