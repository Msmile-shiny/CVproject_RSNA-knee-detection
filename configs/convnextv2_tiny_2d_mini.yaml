# =============================================================================
# RSNA 2026 膝关节异常检测 — 2D 单切片对照配置
# =============================================================================
# 方案: 纯 2D（每张 Sagittal 切片独立作为样本）
# 模型: ConvNeXtV2-Tiny（28M 参数, ImageNet-22k 预训练）
# 数据: mini 集 ~600 exam, 每 exam ~16 张切片 → ~11k 切片
#
# 用途: 作为 2.5D triplet 的 ablation 对照, 量化"相邻切片信息"的收益
#
# ★ 和主力配置 (2.5D) 的核心区别:
#   2D (本配置):      in_channels=1, 单张切片, 需要改造预训练第一层 (3→1 通道)
#   2.5D (主力配置):   in_channels=3, 三张相邻切片堆叠, 直接用原生预训练
#
# 预期结果: 2D macro AUC 比 2.5D 低 1-3 个百分点 (因为丢失了切片间空间信息)
# =============================================================================

experiment:
  name: convnextv2_tiny_2d_mini
  seed: 2026
  stage: 2d_baseline                        # 2d = 单切片
  description: "2D ConvNeXtV2-Tiny on single Sagittal slices — ablation baseline"

# ---------------------------------------------------------------------------
# 路径配置
# ---------------------------------------------------------------------------
paths:
  data_root: data
  npy_root: data/mini/npy
  metadata_csv: data/processed/mini_set_metadata.csv
  train_csv: data/metadata/train.csv
  cache_dir: data/cache/convnextv2_tiny_2d
  output_dir: outputs/convnextv2_tiny_2d_mini
  checkpoint_dir: outputs/convnextv2_tiny_2d_mini/checkpoints
  oof_dir: outputs/convnextv2_tiny_2d_mini/oof

# ---------------------------------------------------------------------------
# 数据配置
# ---------------------------------------------------------------------------
data:
  image_format: npy
  hierarchy: StudyInstanceUID/SeriesInstanceUID/SOPInstanceUID.npy
  image_size: 224
  in_channels: 1                   # ★ 和 2.5D 的唯一区别: 1 通道灰度图
                                   #   需要把预训练第一层 Conv2d(3→96) 改为 Conv2d(1→96)
                                   #   实现: 取 RGB 三通道权重的均值作为新权重
  target_count: 12
  target_columns:
    - ACL
    - MCL
    - Medial Meniscus
    - Lateral Meniscus
    - Medial OA
    - Lateral OA
    - PF OA
    - Effusion
    - Synovitis
    - Baker's
    - Contusion
    - Fracture

  normalization:
    method: percentile_zscore
    lower_percentile: 0.5
    upper_percentile: 99.5
    epsilon: 1.0e-6

  loader:
    train_workers: 4                 # 2D 数据量 ~11k 样本, worker 可以开大点
    valid_workers: 2
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2

validation:
  strategy: stratified_group_kfold
  folds: 5
  group_column: StudyInstanceUID
  shuffle: true
  random_state: 2026
  metric: macro_roc_auc
  save_oof_logits: true
  report_per_target_auc: true
  leakage_checks:
    patient_overlap: error
    study_overlap: error

model:
  arch: convnextv2_tiny
  library: timm
  pretrained: true
  pretrained_source: imagenet22k
  in_channels: 1                    # ★ 灰度图 1 通道
  num_classes: 12
  global_pool: avg
  dropout: 0.3
  drop_path_rate: 0.1

train:
  device: cuda
  epochs: 30
  batch_size: 32                    # ★ 纯 2D 单切片更省显存, batch 可以到 32
                                    #   样本量 ~11k, 每 epoch 约 350 步
  gradient_accumulation_steps: 1
  mixed_precision: true
  precision: fp16
  channels_last: true
  gradient_clip_norm: 1.0
  early_stopping:
    enabled: true
    monitor: val_macro_auc
    mode: max
    patience: 8
    min_delta: 0.0005

optimizer:
  name: adamw
  backbone_lr: 2.0e-5
  head_lr: 1.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  warmup_epochs: 3
  min_lr: 1.0e-6

loss:
  name: bce_with_logits
  label_smoothing: 0.05
  pos_weight: auto

augmentation:
  train:
    horizontal_flip_probability: 0.5
    rotate_limit_degrees: 10
    shift_limit: 0.05
    scale_limit: 0.1
    brightness_contrast_probability: 0.3
    gamma_probability: 0.2
    coarse_dropout_probability: 0.15
  valid:
    resize_only: true

inference:
  aggregation: topk_mean             # 每个 study 的几十张切片取 top-K 均值
  topk_fraction: 0.25
  fold_ensemble: mean_logits
  tta:
    enabled: false
  prediction_range_check: true

logging:
  log_every_n_steps: 20
  save_best_only: true
  save_config_copy: true
  track_gpu_memory: true
  wandb:
    enabled: false

acceptance:
  require_all_targets_in_each_validation_fold: true
  require_zero_patient_leakage: true
  require_finite_oof_predictions: true
  minimum_macro_auc: 0.55
